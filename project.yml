name: Ornamentalist
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGNING_ALLOWED: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
      OTHER_SWIFT_FLAGS: "$(inherited) -enable-actor-data-race-checks"
targets:
  Ornamentalist:
    type: application
    platform: iOS
    sources:
      - path: Ornamentalist.swiftpm/App
      - path: Ornamentalist.swiftpm/Core
      - path: Ornamentalist.swiftpm/CanvasRenderer
      - path: Ornamentalist.swiftpm/DrawingEngine
      - path: Ornamentalist.swiftpm/DocumentStore
      - path: Ornamentalist.swiftpm/ExportEngine
      - path: Ornamentalist.swiftpm/UIComponents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.mandala.prototype
        MARKETING_VERSION: '0.2.2'
        CURRENT_PROJECT_VERSION: '4'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ornamentalist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: NO
  OrnamentalistTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/iOS]
    dependencies:
      - target: Ornamentalist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.mandala.prototype.tests
  OrnamentalistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: Ornamentalist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.mandala.prototype.uitests
schemes:
  Ornamentalist:
    build:
      targets:
        Ornamentalist: all
        OrnamentalistTests: [test]
        OrnamentalistUITests: [test]
    test:
      targets: [OrnamentalistTests, OrnamentalistUITests]
