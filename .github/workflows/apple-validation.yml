name: Apple validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Package iPad source
        run: python3 tools/package_ipad.py
      - name: Preserve iPad project
        uses: actions/upload-artifact@v4
        with:
          name: Ornamentalist-iPad
          path: dist/Ornamentalist-iPad.zip
      - name: Test actual Swift geometry, history and persistence
        run: swift test
      - name: Verify SwiftPM app target source membership
        run: python3 tools/check_playground_target.py
      - name: Generate cloud-only Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select an available iPad simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if 'iPad' in d['name']]
          if not candidates:
              raise SystemExit('No iPad simulator is installed on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IPAD_SIMULATOR=' + candidates[-1]['udid'] + '\n')
          PY
      - name: Compile native app and test bundle
        timeout-minutes: 5
        run: >-
          xcodebuild build-for-testing -project Ornamentalist.xcodeproj -scheme Ornamentalist
          -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR"
          -derivedDataPath DerivedData
          -only-testing:OrnamentalistTests
          CODE_SIGNING_ALLOWED=NO
      - name: Verify PNG export pixel parity
        timeout-minutes: 3
        run: >-
          xcodebuild test-without-building -project Ornamentalist.xcodeproj -scheme Ornamentalist
          -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR"
          -derivedDataPath DerivedData -resultBundlePath ExportTests.xcresult
          -only-testing:OrnamentalistTests/PNGExportOptimizationTests
          -parallel-testing-enabled NO -destination-timeout 60
          -test-timeouts-enabled YES -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 90
          CODE_SIGNING_ALLOWED=NO
      - name: Verify zoom preview and liner migration
        timeout-minutes: 4
        run: >-
          xcodebuild test-without-building -project Ornamentalist.xcodeproj -scheme Ornamentalist
          -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR"
          -derivedDataPath DerivedData -resultBundlePath ZoomTests.xcresult
          -only-testing:OrnamentalistTests/RendererCacheTests/testViewportPreviewTransformsImageWithoutReplayingGeometry
          -only-testing:OrnamentalistTests/StudioModelTests/testLinerDefaultsMigrateOnceWithoutChangingSavedInkOrLaterChoices
          -parallel-testing-enabled NO -destination-timeout 60
          -test-timeouts-enabled YES -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 90
          CODE_SIGNING_ALLOWED=NO
      - name: Run native model and energy scheduling tests
        timeout-minutes: 4
        run: >-
          xcodebuild test-without-building -project Ornamentalist.xcodeproj -scheme Ornamentalist
          -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR"
          -derivedDataPath DerivedData -resultBundlePath ModelTests.xcresult
          -only-testing:OrnamentalistTests/StudioModelTests
          -parallel-testing-enabled NO -destination-timeout 60
          -test-timeouts-enabled YES -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 90
          CODE_SIGNING_ALLOWED=NO
      - name: Check Metal image rendering before full GPU suite
        timeout-minutes: 3
        env:
          SIMCTL_CHILD_MTL_DEBUG_LAYER: '1'
          SIMCTL_CHILD_MTL_SHADER_VALIDATION: '1'
        run: >-
          xcodebuild test-without-building -project Ornamentalist.xcodeproj -scheme Ornamentalist
          -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR"
          -derivedDataPath DerivedData -resultBundlePath MetalSmoke.xcresult
          -only-testing:OrnamentalistTests/EditingToolsNativeTests/testImagePlacementMatchesMetalAndPNGAndInvalidatesRasterCache
          -parallel-testing-enabled NO -destination-timeout 60
          -test-timeouts-enabled YES -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 90
          CODE_SIGNING_ALLOWED=NO
      - name: Run remaining native PNG and Metal tests
        timeout-minutes: 6
        run: >-
          xcodebuild test-without-building -project Ornamentalist.xcodeproj -scheme Ornamentalist
          -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR"
          -derivedDataPath DerivedData -resultBundlePath AppleTests.xcresult
          -only-testing:OrnamentalistTests
          -skip-testing:OrnamentalistTests/StudioModelTests
          -skip-testing:OrnamentalistTests/EditingToolsNativeTests/testImagePlacementMatchesMetalAndPNGAndInvalidatesRasterCache
          -parallel-testing-enabled NO -destination-timeout 60
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 45
          -maximum-test-execution-time-allowance 90
          CODE_SIGNING_ALLOWED=NO
      - name: Export native UI screenshots
        if: always()
        run: |
          if [ -d AppleTests.xcresult ]; then
            xcrun xcresulttool export attachments --path AppleTests.xcresult --output-path UISnapshots
          fi
      - name: Preserve native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-screenshots
          path: UISnapshots
          if-no-files-found: ignore
      - name: Preserve Apple test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-results
          path: |
            AppleTests.xcresult
            ModelTests.xcresult
            MetalSmoke.xcresult
            ZoomTests.xcresult
            ExportTests.xcresult
          if-no-files-found: ignore
